[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lusiscan-demo"
version = "0.1.0"
description = "Controlled demo target repo for LusiScan. Intentionally pins outdated dependencies so the agent has something to upgrade."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LusiScan" }]

# Intentionally outdated pins so LusiScan has upgrades to detect:
#   - requests: a patch behind latest 2.32.x  -> safe auto-fix patch bump demo
#   - pydantic: pinned to 1.x                 -> human-in-the-loop 1->2 major upgrade demo
dependencies = [
    "requests==2.31.0",
    "pydantic==1.10.13",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["demo_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
